  <!-- ============================================================
       RESUME VIEWER
       Shows the PDF right on the page. "Open in New Tab" and
       "Download PDF" both point at the same file — see the
       RESUME FILE comment below for exactly where to swap in an
       updated resume later.
       ============================================================ -->
  <section class="section">
    <div class="wrap">

      <div class="resume-actions">
        <!-- RESUME FILE: replace files/William-Miller-Resume.pdf with a
             new file of the same name to update the resume everywhere
             on this page at once (viewer + both buttons). -->
        <a class="btn" href="files/William-Miller-Resume.pdf" target="_blank" rel="noopener">Open in New Tab</a>
        <a class="btn" href="files/William-Miller-Resume.pdf" target="_blank" rel="noopener" download>Download PDF</a>
      </div>

      <div class="resume-viewer">
        <iframe src="files/William-Miller-Resume.pdf" title="William Miller's resume">
          <p class="resume-fallback">
            Your browser can't display the PDF here.
            <a href="files/William-Miller-Resume.pdf">Download it directly</a> instead.
          </p>
        </iframe>
      </div>

    </div>
  </section>
